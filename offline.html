<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7C66">
  <title>Sedang offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #F5F9F8; color: #10201C; text-align: center; }
    .kotak { max-width: 360px; }
    .ikon { font-size: 56px; }
    h1 { font-size: 1.4rem; margin: 12px 0 8px; }
    p { color: #55655F; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; background: #0E7C66; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="kotak">
    <div class="ikon" aria-hidden="true">📶</div>
    <h1>Kamu sedang offline</h1>
    <p>Periksa koneksi internetmu, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
